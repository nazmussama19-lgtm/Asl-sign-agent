name: CI

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install numpy==1.26.4 pytest ruff
      - name: Lint (syntax errors, undefined names)
        run: ruff check .
      - name: Run tests (core modules and conversation engine, no webcam/TF/API key needed)
        run: pytest tests/ -q
