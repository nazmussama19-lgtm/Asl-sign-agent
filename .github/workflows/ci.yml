name: CI

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install numpy==1.26.4 pytest ruff
      - name: Lint (syntax errors, undefined names)
        run: ruff check .
      - name: Run tests (core modules and conversation engine, no webcam/TF/API key needed)
        run: pytest tests/ -q

  web-models:
    # The web demo reimplements the Keras models; check the reference forward pass against Keras itself.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install TensorFlow and h5py
        run: pip install tensorflow-cpu==2.15.0 "numpy<2" h5py pytest
      - name: NumPy forward pass matches Keras
        run: pytest tests/test_web_models.py -q

  web:
    # The React demo: type check, unit tests (models and agent against the Python references), build.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
